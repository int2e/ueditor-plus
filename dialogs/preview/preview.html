<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <script src="../internal.js?{timestamp}"></script>
    <script src="../../ueditor.parse.js?{timestamp}"></script>
    <title></title>
</head>
<body class="view"></body>
<script>
    // This document displays article content, so dialog chrome styles do not apply.
    var chromeStyle = document.querySelector('link[href*="dialogbase.css"]');
    if (chromeStyle) chromeStyle.remove();
    document.body.innerHTML = editor.getContent();
    editor.applyContentStylesTo(document);
    uParse('body', {
        rootPath: new URL(editor.options.UEDITOR_HOME_URL, window.parent.document.baseURI).href,
        chartContainerHeight: 500
    });
    dialog.oncancel = function () { document.body.innerHTML = ''; };
</script>
</html>
